<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>私人模考</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar" class="topbar">
  <div class="brand" id="brand">🔒 私人模考</div>
  <div class="examhud hidden" id="hud">
    <span id="hudSection"></span>
    <span id="hudQ" class="hudq"></span>
    <span class="timer" id="hudTimer">--:--</span>
  </div>
  <div class="volwrap simonly"><button type="button" class="volbtn" id="volBtn">🔊<span class="vtx"> Volume</span></button>
    <div class="volpop hidden" id="volPop">音量 Volume<br><input type="range" id="volRange" min="0" max="100" value="100"></div></div>
</header>
<main id="app" class="app"></main>
<footer class="foot" id="foot">
  <p>仅限个人学习使用。所有内容均已加密，需要密码才能查看。</p>
</footer>
<div id="simbar" class="simbar hidden"></div>
<div id="overlay" class="overlay hidden"></div>
<script src="js/app.js"></script>
</body>
</html>
